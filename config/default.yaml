# ============================================================
# MusicUnderstand 2.0 — 默认配置
# Step 1 (2026-05-22): Transformer Backbone + Emotion Head
# 硬件: GTX 1650 (4GB VRAM)
# ============================================================

model:
  backbone:
    # Mel频谱 → Patch Embedding
    input_channels: 1
    n_mels: 128
    conv1_channels: 64
    conv2_channels: 128
    freq_compression: 8           # 频带压缩倍率: 128 → 128/8 = 16
    d_model: 256                  # Transformer隐层维度
    nhead: 8                      # 注意力头数（必须整除 d_model）
    num_layers: 6                 # Transformer Encoder 层数
    dim_feedforward: 1024         # FFN 隐层维度
    dropout: 0.1
    max_seq_len: 512

  experts:
    emotion:
      input_dim: 256
      hidden_dim: 128
      output_dim: 12              # 4维 × 3统计量 (mean, delta, var)
      loss_weight: 1.0

data:
  # 特征提取
  sample_rate: 22050
  n_mels: 128
  n_fft: 2048
  hop_length: 512                 # ~0.023秒/帧
  frame_aggregation: 21           # 每21帧聚合成一个输出点 ≈ 0.5秒
  max_duration: 30.0              # 统一截取30秒
  # 这个值需要精确: 30秒 / (hop_length/sr * frame_aggregation)
  # 30 / (512/22050 * 21) ≈ 30 / 0.488 ≈ 61.5 → 舍入为61帧
  # 实际会做padding/truncation到固定值
  target_frames: 30               # 输出时间步数 (15秒 / 0.5秒), 与v1一致

  # DEAM 标注参数
  deam:
    annot_start_sec: 15.0         # DEAM标注从第15秒开始
    annot_step_sec: 0.5           # 标注步长0.5秒

train:
  batch_size: 16                   # GTX 1650 4GB: batch 16 安全 (2026-07-11 改回文档记录的安全值)
  num_workers: 0                  # 2026-07-11 从4改回0：系统内存紧张(空闲曾探底到877MB)，
                                   # 4-worker每epoch重新spawn子进程(各自加载torch+CUDA)造成
                                   # 内存尖峰，疑似触发了外部OOM杀进程；单进程加载慢但稳
  device: cuda                    # CUDA if available, else cpu
  seed: 42
  # Phase 2a: 训练Emotion Head（Step 1）
  emotion:
    epochs: 100
    learning_rate: 0.001
    weight_decay: 0.00001
    patience: 15                  # 早停耐心
    log_interval: 5
    gradient_clip: 1.0            # 梯度裁剪
    # 各loss分量的权重
    loss_weights:
      valence_mean: 1.0
      arousal_mean: 1.0
      valence_delta: 0.5
      arousal_delta: 0.5
      valence_var: 0.3
      arousal_var: 0.3
      # Tension/Complexity: DSP启发式伪标签(见data/dsp_pseudo_labels.py)，
      # 不是人工标注真值，权重跟V/A保持一致(同样的regression设置，没理由降权)
      tension_mean: 1.0
      complexity_mean: 1.0
      tension_delta: 0.5
      complexity_delta: 0.5
      tension_var: 0.3
      complexity_var: 0.3

paths:
  deam_root: D:/Musiclearner/data/deam
  checkpoint_dir: D:/Musiclearner/checkpoints
  log_dir: D:/Musiclearner/logs
